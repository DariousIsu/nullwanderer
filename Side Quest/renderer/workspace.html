<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Workspace</title>
<style>
/* === My Workspace shell — Window 3 of the 3-window model (operator surfaces + studios) ====
   Hosts each surface in a <webview> so proven surfaces (the Editor) embed untouched. Reuses
   the canonical dark kit (studio/shell.css tokens), kept in sync with editor.html. ========= */
:root{
  --bg:#0d0d10;--bg-deep:#0a0a0d;--bg-panel:#121218;--bg-raised:#1a1a20;
  --line-faint:#15151a;--line:#1f1f24;--line-strong:#2a2a30;--line-hover:#4a4a52;
  --tx:#e8e8eb;--tx-soft:#d8d8db;--tx-muted:#9a9aa3;--tx-dim:#6a6a73;--tx-fainter:#4a4a52;
  --accent:#6a86b6;--accent-soft:#3a4a66;--ok-fg:#7fb069;--warn-fg:#d4a857;
  --r-sm:5px;--r-md:8px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;font-size:14px;display:flex;height:100vh;overflow:hidden;}

/* ---- rail ---- */
.rail{width:222px;flex-shrink:0;background:var(--bg-deep);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px 0;}
.rail .brand{padding:4px 18px 14px;font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:var(--tx-muted);font-weight:700;}
.rail .grp{padding:14px 18px 5px;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:var(--tx-fainter);}
.surface{display:flex;align-items:center;gap:10px;width:100%;padding:8px 18px;background:transparent;border:0;border-left:2px solid transparent;color:var(--tx-muted);font:inherit;font-size:13px;text-align:left;cursor:pointer;transition:background 120ms,color 120ms,border-color 120ms;}
.surface:hover:not(:disabled){background:var(--bg-panel);color:var(--tx-soft);}
.surface.active{background:var(--bg-panel);color:var(--tx);border-left-color:var(--accent);}
.surface:disabled{color:var(--tx-ghost,#3a3a42);cursor:default;}
.surface .ic{width:16px;text-align:center;opacity:0.8;}
.surface .soon{margin-left:auto;font-size:9px;letter-spacing:0.08em;text-transform:uppercase;color:var(--tx-fainter);border:1px solid var(--line-strong);border-radius:3px;padding:1px 4px;}
.rail .spacer{flex:1;}
.rail .foot{padding:10px 18px 2px;font-size:10px;color:var(--tx-fainter);border-top:1px solid var(--line-faint);}

/* ---- content ---- */
.content{flex:1;display:flex;flex-direction:column;min-width:0;}
.topbar{flex-shrink:0;height:42px;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--line-faint);background:var(--bg-panel);}
.topbar .t{font-size:13px;color:var(--tx-soft);font-weight:600;}
.topbar .sub{font-size:11px;color:var(--tx-dim);}
.surface-host{flex:1;position:relative;min-height:0;background:var(--bg);}
webview{position:absolute;inset:0;width:100%;height:100%;border:0;display:inline-flex;}
.placeholder{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--tx-dim);text-align:center;padding:40px;}
.placeholder.show{display:flex;}
.placeholder .big{font-size:15px;color:var(--tx-muted);}
.placeholder .small{font-size:12px;color:var(--tx-fainter);max-width:420px;line-height:1.6;}
</style>
</head>
<body>
  <nav class="rail">
    <div class="brand">My Workspace</div>

    <div class="grp">Studios</div>
    <button class="surface active" data-surface="editor" data-src="editor.html" data-title="Editor's Studio" data-sub="Pre-publication verification &amp; certification">
      <span class="ic">&#9638;</span>Editor<span></span>
    </button>
    <button class="surface" data-surface="creator" data-src="creator.html" data-title="Creator" data-sub="Research writing &amp; authoring on the document substrate">
      <span class="ic">&#9998;</span>Creator<span></span>
    </button>
    <button class="surface" data-surface="search" data-src="search.html" data-title="Super Search" data-sub="Unified — owned corpus + AI-assisted web">
      <span class="ic">&#9906;</span>Super Search<span></span>
    </button>

    <div class="grp">Data</div>
    <button class="surface" data-surface="crm" data-src="crm.html" data-title="CRM" data-sub="Rolodex · contacts, committees, donations"><span class="ic">&#128100;</span>CRM<span></span></button>
    <button class="surface" data-surface="kg" data-src="kg.html" data-title="Knowledge Graph" data-sub="Entity network · overview &amp; ego-walk"><span class="ic">&#9737;</span>Knowledge Graph<span></span></button>
    <button class="surface" data-surface="polling" data-src="polling.html" data-title="Polling" data-sub="Fieldings · toplines · triage"><span class="ic">&#9776;</span>Polling<span></span></button>
    <button class="surface" data-surface="legislation" data-src="legislation.html" data-title="Legislation" data-sub="Bills · sponsors, votes, related"><span class="ic">&#167;</span>Legislation<span></span></button>
    <button class="surface" disabled data-surface="map"><span class="ic">&#9906;</span>Map<span class="soon">soon</span></button>
    <button class="surface" data-surface="files" data-src="reader.html" data-title="Reader / Library" data-sub="Corpus documents on the document substrate"><span class="ic">&#128193;</span>Files &amp; Reader<span></span></button>

    <div class="spacer"></div>
    <div class="foot">Operator workbench · studios are operator-only</div>
  </nav>

  <main class="content">
    <header class="topbar">
      <span class="t" id="surface-title">Editor's Studio</span>
      <span class="sub" id="surface-sub">Pre-publication verification &amp; certification</span>
    </header>
    <div class="surface-host" id="host">
      <webview id="surface" src="editor.html"></webview>
      <div class="placeholder" id="placeholder">
        <div class="big" id="ph-title">Coming soon</div>
        <div class="small" id="ph-sub">This surface will consolidate the corresponding Echo data browser into My Workspace.</div>
      </div>
    </div>
  </main>

  <script src="workspace.js"></script>
</body>
</html>
