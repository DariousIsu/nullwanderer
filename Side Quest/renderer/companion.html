<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Zoe</title>
<style>
  html,body{height:100%;margin:0;background:transparent;overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;}
  /* the whole window is a drag handle (frameless) — she floats and you reposition her by dragging */
  #stage{position:fixed;inset:0;-webkit-app-region:drag;}
  canvas{display:block;width:100%;height:100%;}
  /* a faint hover chrome: a hide button, only visible on hover, not part of the drag region */
  #chrome{position:fixed;top:4px;right:6px;opacity:0;transition:opacity .15s;-webkit-app-region:no-drag;}
  body:hover #chrome{opacity:1;}
  #chrome button{background:rgba(20,20,26,.7);border:1px solid #2a2a30;color:#9a9aa3;font:inherit;
    font-size:12px;line-height:1;width:20px;height:20px;border-radius:4px;cursor:pointer;}
  #chrome button:hover{color:#e8e8eb;border-color:#4a4a52;}
</style>
</head>
<body>
  <div id="stage"><canvas id="face"></canvas></div>
  <div id="chrome"><button id="hide" title="Hide Zoe">✕</button></div>

<script src="vendor/avatar_vrm.bundle.js"></script>
<script>
  const canvas = document.getElementById('face');
  // size the canvas to the window (frameless) and keep it in sync
  function fit() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; if (window.__face) window.__face.resize(canvas.width, canvas.height); }
  fit();

  const face = window.ZoeAvatarVRM.create(canvas, { vrmUrl: '../data/avatars/zoe.vrm', framing: 'full' });
  window.__face = face;                       // V4 will attachAudio() here to lip-sync her speech
  face.loaded.then(() => { fit(); face.setFeeling('warm and content'); face.start(); })
             .catch((e) => console.error('[companion] vrm load failed:', e && e.message || e));
  window.addEventListener('resize', fit);

  // reflect her LIVING mood: poll the same meta the rest of the app reads (lib/mood → 'mood_state').
  let lastFeeling = 'warm and content';
  async function refreshMood() {
    try {
      const raw = await window.sq.getMeta('mood_state');
      if (raw) { const m = JSON.parse(raw); if (m && m.feeling) { lastFeeling = m.feeling; if (!speaking) face.setFeeling(m.feeling); } }
    } catch { /* fail-soft: keep her resting expression */ }
  }
  refreshMood();
  setInterval(refreshMood, 20000);

  // V4: speak a chat reply — main synthesized the wav (local Piper) and hands us the URL. Play it and
  // lip-sync the avatar to its live amplitude (attachAudio → AnalyserNode → mouth). Restore mood when done.
  let speaking = false;
  try {
    window.sq.onCompanionSpeak(({ url }) => {
      if (!url) return;
      const a = new Audio(url);            // fresh element each utterance (createMediaElementSource is once-per-element)
      try { face.attachAudio(a); } catch {}
      speaking = true; face.setMood('talking');
      const done = () => { speaking = false; face.setFeeling(lastFeeling); };
      a.addEventListener('ended', done);
      a.addEventListener('error', done);
      a.play().catch(() => done());
    });
  } catch { /* no speech bridge → she stays silent, still present */ }

  document.getElementById('hide').addEventListener('click', () => { try { window.sq.companionHide(); } catch { window.close(); } });
</script>
</body>
</html>
