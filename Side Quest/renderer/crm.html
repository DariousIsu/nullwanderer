<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM</title>
<style>
/* === CRM (Rolodex) surface — canonical dark kit (mirrors polling.html) ===================== */
:root{
  --bg:#0d0d10;--bg-deep:#0a0a0d;--bg-panel:#121218;--bg-raised:#1a1a20;
  --line-faint:#15151a;--line:#1f1f24;--line-strong:#2a2a30;--line-hover:#4a4a52;
  --tx:#e8e8eb;--tx-soft:#d8d8db;--tx-muted:#9a9aa3;--tx-dim:#6a6a73;--tx-fainter:#4a4a52;
  --accent:#6a86b6;
  --rep:#c98a8a;--dem:#8aa6c9;--ind:#b0a86a;
  --ok-fg:#a8d8a8;--info-fg:#9ab2cc;--info-bg:#1a222e;--info-line:#4a6480;
  --r-sm:3px;--r:4px;--r-lg:6px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:var(--bg);color:var(--tx-soft);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Inter",system-ui,sans-serif;font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;}
[hidden]{display:none !important;}
.studio{height:100vh;display:flex;flex-direction:column;overflow:hidden;}
.studio-head{flex-shrink:0;display:flex;align-items:center;gap:12px;padding:13px 20px;border-bottom:1px solid var(--line-faint);flex-wrap:wrap;}
.studio-id{display:flex;align-items:center;gap:10px;}
.studio-mark{font-size:16px;color:var(--tx-dim);}
.studio-title{font-size:10px;letter-spacing:0.2em;text-transform:uppercase;color:var(--tx-muted);}
.studio-sub{font-size:11px;color:var(--tx-fainter);}
.spacer{flex:1;}
.qbox{position:relative;min-width:210px;}
.qbox input{width:100%;background:var(--bg-deep);border:1px solid var(--line-strong);color:var(--tx);font:inherit;font-size:13px;padding:7px 11px;border-radius:var(--r);outline:none;}
.qbox input:focus{border-color:var(--accent);}
select{background:var(--bg-deep);border:1px solid var(--line-strong);color:var(--tx-soft);font:inherit;font-size:12px;padding:6px 8px;border-radius:var(--r-sm);outline:none;max-width:150px;}
select:focus{border-color:var(--accent);}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:8px 20px;border-bottom:1px solid var(--line-faint);min-height:0;}
.chips:empty{display:none;}
.fchip{font-size:11px;color:var(--tx-muted);background:var(--bg-raised);border:1px solid var(--line-strong);border-radius:11px;padding:2px 8px 2px 10px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;}
.fchip:hover{border-color:var(--line-hover);color:var(--tx-soft);}
.fchip .x{color:var(--tx-fainter);font-size:13px;}

.main{flex:1;display:flex;min-height:0;}
.list{width:336px;flex-shrink:0;border-right:1px solid var(--line);display:flex;flex-direction:column;background:var(--bg-deep);}
.list .head{padding:8px 14px;font-size:11px;color:var(--tx-dim);border-bottom:1px solid var(--line-faint);}
.list .rows{flex:1;overflow-y:auto;}
.list .rows::-webkit-scrollbar,.detail::-webkit-scrollbar{width:7px;}
.list .rows::-webkit-scrollbar-thumb,.detail::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:4px;}
.citem{padding:9px 14px;border-bottom:1px solid var(--line-faint);cursor:pointer;}
.citem:hover{background:var(--bg-panel);}
.citem.active{background:var(--bg-panel);border-left:2px solid var(--accent);padding-left:12px;}
.citem .nm{font-size:13px;color:var(--tx);}
.citem .sub{font-size:11px;color:var(--tx-dim);margin-top:1px;display:flex;gap:7px;align-items:center;flex-wrap:wrap;}
.pdot{width:6px;height:6px;border-radius:50%;display:inline-block;background:var(--tx-fainter);}
.pdot.R{background:var(--rep);}.pdot.D{background:var(--dem);}.pdot.I{background:var(--ind);}
.more{padding:10px 14px;text-align:center;}
.more button{background:transparent;border:1px solid var(--line-strong);color:var(--tx-muted);font:inherit;font-size:12px;padding:6px 14px;border-radius:var(--r-sm);cursor:pointer;}
.more button:hover{border-color:var(--line-hover);color:var(--tx-soft);}

.detail{flex:1;overflow-y:auto;padding:22px 28px 48px;min-width:0;}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--tx-dim);text-align:center;gap:6px;}
.empty .big{font-size:15px;color:var(--tx-muted);}
.empty .small{font-size:12px;color:var(--tx-fainter);max-width:380px;}
.c-name{font-size:20px;color:var(--tx);font-weight:600;}
.c-title{font-size:13px;color:var(--tx-muted);margin-top:2px;}
.c-meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--tx-muted);margin:12px 0;}
.c-meta b{color:var(--tx-soft);font-weight:600;}
.c-row{display:flex;gap:8px;font-size:12.5px;margin:3px 0;}
.c-row .k{width:96px;flex-shrink:0;color:var(--tx-fainter);}
.c-row .v{color:var(--tx-soft);}
.c-row .v a{color:var(--info-fg);text-decoration:none;}
.sec{margin-top:20px;}
.sec .h{font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:var(--tx-dim);border-bottom:1px solid var(--line-faint);padding-bottom:6px;margin-bottom:10px;}
.rel{display:flex;flex-wrap:wrap;gap:7px;}
.relchip{font-size:11.5px;color:var(--tx-muted);background:var(--bg-raised);border:1px solid var(--line-strong);border-radius:11px;padding:3px 11px;}
.relchip b{color:var(--tx);font-weight:600;}
.status{padding:16px;color:var(--tx-dim);font-size:12px;}
.err{padding:16px;color:#d8c79a;font-size:12px;}
</style>
</head>
<body>
  <div class="studio">
    <div class="studio-head">
      <div class="studio-id"><span class="studio-mark">&#128100;</span><div><div class="studio-title">CRM</div><div class="studio-sub">Rolodex</div></div></div>
      <div class="spacer"></div>
      <div class="qbox"><input id="q" type="text" placeholder="Search name / title / email…" autocomplete="off" spellcheck="false"></div>
      <select id="f-party"><option value="">Party</option></select>
      <select id="f-chamber"><option value="">Chamber</option></select>
      <select id="f-state"><option value="">State</option></select>
      <select id="f-tier"><option value="">Tier</option></select>
    </div>
    <div class="chips" id="chips"></div>
    <div class="main">
      <div class="list">
        <div class="head" id="listhead">Loading…</div>
        <div class="rows" id="rows"></div>
      </div>
      <div class="detail" id="detail">
        <div class="empty"><div class="big">CRM · Rolodex</div><div class="small">Search or filter by party / chamber / state / tier, then select a contact for their full record and related lists.</div></div>
      </div>
    </div>
  </div>
  <script src="crm.js"></script>
</body>
</html>
