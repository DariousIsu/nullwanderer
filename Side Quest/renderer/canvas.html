<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Canvas</title>
<style>
/* === Canvas surface — read-only renderer over Echo's saga canvas (mirrors crm.html kit) ====== */
:root{
  --bg:#0d0d10;--bg-deep:#0a0a0d;--bg-panel:#121218;--bg-raised:#1a1a20;
  --line-faint:#15151a;--line:#1f1f24;--line-strong:#2a2a30;--line-hover:#4a4a52;
  --tx:#e8e8eb;--tx-soft:#d8d8db;--tx-muted:#9a9aa3;--tx-dim:#6a6a73;--tx-fainter:#4a4a52;
  --accent:#6a86b6;
  --doc:#8aa6c9;--illu:#b08ac9;--research:#8ac9a6;--job:#c9b08a;
  --ok-fg:#a8d8a8;--info-fg:#9ab2cc;--warn-fg:#d4a857;
  --r-sm:3px;--r:4px;--r-lg:6px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:var(--bg);color:var(--tx-soft);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Inter",system-ui,sans-serif;font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;}
[hidden]{display:none !important;}
.studio{height:100vh;display:flex;flex-direction:column;overflow:hidden;}
.studio-head{flex-shrink:0;display:flex;align-items:center;gap:12px;padding:13px 20px;border-bottom:1px solid var(--line-faint);}
.studio-id{display:flex;align-items:center;gap:10px;}
.studio-mark{font-size:16px;color:var(--tx-dim);}
.studio-title{font-size:10px;letter-spacing:0.2em;text-transform:uppercase;color:var(--tx-muted);}
.studio-sub{font-size:11px;color:var(--tx-fainter);}
.spacer{flex:1;}
.refresh{background:transparent;border:1px solid var(--line-strong);color:var(--tx-muted);font:inherit;font-size:12px;padding:6px 13px;border-radius:var(--r-sm);cursor:pointer;}
.refresh:hover{border-color:var(--line-hover);color:var(--tx-soft);}

.main{flex:1;display:flex;min-height:0;}
.list{width:300px;flex-shrink:0;border-right:1px solid var(--line);display:flex;flex-direction:column;background:var(--bg-deep);}
.list .head{padding:8px 14px;font-size:11px;color:var(--tx-dim);border-bottom:1px solid var(--line-faint);}
.list .rows{flex:1;overflow-y:auto;}
.list .rows::-webkit-scrollbar,.detail::-webkit-scrollbar{width:7px;}
.list .rows::-webkit-scrollbar-thumb,.detail::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:4px;}
.titem{padding:10px 14px;border-bottom:1px solid var(--line-faint);cursor:pointer;}
.titem:hover{background:var(--bg-panel);}
.titem.active{background:var(--bg-panel);border-left:2px solid var(--accent);padding-left:12px;}
.titem .nm{font-size:13px;color:var(--tx);}
.titem .sub{font-size:11px;color:var(--tx-dim);margin-top:2px;display:flex;gap:7px;align-items:center;flex-wrap:wrap;}
.mode{font-size:9px;letter-spacing:0.08em;text-transform:uppercase;border:1px solid var(--line-strong);border-radius:3px;padding:1px 5px;color:var(--tx-muted);}
.mode.DOC{color:var(--doc);border-color:var(--doc);}
.mode.ILLUSTRATIVE{color:var(--illu);border-color:var(--illu);}
.mode.RESEARCH{color:var(--research);border-color:var(--research);}
.mode.JOB{color:var(--job);border-color:var(--job);}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block;}
.dot.open{background:var(--ok-fg);}
.dot.closed{background:var(--tx-fainter);}

.detail{flex:1;overflow-y:auto;padding:24px 30px 56px;min-width:0;}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--tx-dim);text-align:center;gap:6px;}
.empty .big{font-size:15px;color:var(--tx-muted);}
.empty .small{font-size:12px;color:var(--tx-fainter);max-width:400px;}
.canvas-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line-faint);padding-bottom:14px;margin-bottom:8px;}
.canvas-title{font-size:21px;color:var(--tx);font-weight:600;}
.canvas-meta{font-size:11.5px;color:var(--tx-dim);display:flex;gap:10px;align-items:center;flex-wrap:wrap;}

/* block stream */
.block{margin:18px 0;}
.block .blabel{font-size:9px;letter-spacing:0.1em;text-transform:uppercase;color:var(--tx-fainter);margin-bottom:5px;}
.b-heading{color:var(--tx);font-weight:600;margin:22px 0 4px;}
h1.b-heading{font-size:22px;}h2.b-heading{font-size:18px;}h3.b-heading{font-size:15px;}
.b-paragraph{font-size:13.5px;color:var(--tx-soft);}
.b-paragraph p{margin:8px 0;}
.b-paragraph code{background:var(--bg-raised);border:1px solid var(--line);border-radius:3px;padding:1px 5px;font-size:12px;}
.b-paragraph strong{color:var(--tx);}
.b-paragraph a{color:var(--info-fg);text-decoration:none;}
table.b-table{border-collapse:collapse;width:100%;font-size:12.5px;margin:6px 0;}
table.b-table th,table.b-table td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top;}
table.b-table th{background:var(--bg-raised);color:var(--tx-soft);font-weight:600;}
.tcaption{font-size:11px;color:var(--tx-dim);margin-top:4px;}
.card{background:var(--bg-panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 16px;}
.card.fallback{border-style:dashed;}
.card .ctype{font-size:11px;color:var(--tx-muted);font-weight:600;}
.card .cnote{font-size:11px;color:var(--tx-fainter);margin-top:2px;}
.card pre{margin-top:8px;font-size:11.5px;color:var(--tx-dim);white-space:pre-wrap;word-break:break-word;font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;}
.chart-meta{font-size:12px;color:var(--tx-muted);margin-bottom:6px;}
.status{padding:16px;color:var(--tx-dim);font-size:12px;}
.err{padding:16px;color:#d8c79a;font-size:12px;}
</style>
</head>
<body>
  <div class="studio">
    <div class="studio-head">
      <div class="studio-id"><span class="studio-mark">&#9707;</span><div><div class="studio-title">Canvas</div><div class="studio-sub">Saga canvas — deliverables &amp; visual aids</div></div></div>
      <div class="spacer"></div>
      <button class="refresh" id="refreshBtn">Refresh</button>
    </div>
    <div class="main">
      <div class="list">
        <div class="head" id="listhead">Loading…</div>
        <div class="rows" id="rows"></div>
      </div>
      <div class="detail" id="detail">
        <div class="empty"><div class="big">Canvas</div><div class="small">Select a canvas tab to view its blocks. The canvas renders Echo's saga store (read-only in this slice).</div></div>
      </div>
    </div>
  </div>
  <script src="canvas.js"></script>
</body>
</html>
