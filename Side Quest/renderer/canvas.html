<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zoe's Canvas</title>
<style>
/* === Zoe's Canvas — the window IS the canvas. Whole DOCUMENTS (each = a saga tab, blocks flowing
   inside like the Editor) are movable objects on an infinite pannable/zoomable surface. The tray is
   an overlay drawer that lists/focuses documents. =========================================== */
:root{
  --bg:#0d0d10;--bg-deep:#0a0a0d;--bg-panel:#121218;--bg-raised:#1a1a20;
  --line-faint:#15151a;--line:#1f1f24;--line-strong:#2a2a30;--line-hover:#4a4a52;
  --tx:#e8e8eb;--tx-soft:#d8d8db;--tx-muted:#9a9aa3;--tx-dim:#6a6a73;--tx-fainter:#4a4a52;
  --accent:#6a86b6;
  --doc:#8aa6c9;--illu:#b08ac9;--research:#8ac9a6;--job:#c9b08a;
  --ok-fg:#a8d8a8;--info-fg:#9ab2cc;
  --r-sm:3px;--r:4px;--r-lg:8px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--tx-soft);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Inter",system-ui,sans-serif;font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;}

.topbar{position:absolute;top:0;left:0;right:0;height:40px;z-index:30;display:flex;align-items:center;gap:12px;padding:0 14px;background:var(--bg-panel);border-bottom:1px solid var(--line);}
.topbar .brand{font-size:10px;letter-spacing:0.2em;text-transform:uppercase;color:var(--tx-muted);font-weight:700;}
.topbar .count{font-size:11px;color:var(--tx-dim);}
.topbar .spacer{flex:1;}
.topbar button{background:transparent;border:1px solid var(--line-strong);color:var(--tx-muted);font:inherit;font-size:11px;padding:5px 11px;border-radius:var(--r-sm);cursor:pointer;}
.topbar button:hover{border-color:var(--line-hover);color:var(--tx-soft);}
.topbar .hint{font-size:10px;color:var(--tx-fainter);}

/* the canvas viewport fills everything below the topbar */
.surface{position:absolute;top:40px;left:0;right:0;bottom:0;overflow:hidden;cursor:grab;
  background:radial-gradient(circle, var(--line) 1px, transparent 1px) 0 0/28px 28px;}
.surface.grabbing{cursor:grabbing;}
.surface.drop-hover::after{content:"Drop document to add it to the canvas";position:absolute;inset:8px;border:2px dashed var(--accent);border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--accent);font-size:14px;background:rgba(106,134,182,.06);pointer-events:none;z-index:15;}
.toast{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);background:var(--bg-raised);border:1px solid var(--line-strong);color:var(--tx-soft);font-size:12px;padding:8px 14px;border-radius:6px;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none;max-width:70%;}
.toast.show{opacity:1;}
.board{position:absolute;top:0;left:0;transform-origin:0 0;width:1px;height:1px;}
.surface-msg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:var(--tx-dim);font-size:13px;text-align:center;}
.surface-msg .small{font-size:11px;color:var(--tx-fainter);margin-top:6px;}

/* a DOCUMENT object on the canvas (whole, formatted; blocks live inside; movable + resizable) */
.doc{position:absolute;width:460px;min-width:240px;max-width:1200px;max-height:92vh;display:flex;flex-direction:column;background:var(--bg-panel);border:1px solid var(--line-strong);border-radius:var(--r-lg);box-shadow:0 8px 30px rgba(0,0,0,.45);overflow:hidden;}
.doc.focus{border-color:var(--accent);}
.doc.dragging{border-color:var(--accent);box-shadow:0 14px 40px rgba(0,0,0,.6);}
.doc.minimized{height:auto !important;}
.doc.minimized .doc-body,.doc.minimized .resize-grip{display:none;}
.doc-head{flex-shrink:0;display:flex;align-items:center;gap:9px;padding:9px 13px;background:var(--bg-raised);border-bottom:1px solid var(--line);cursor:grab;user-select:none;}
.doc.minimized .doc-head{border-bottom:0;}
.doc.dragging .doc-head{cursor:grabbing;}
.doc-head .grip{color:var(--tx-fainter);font-size:13px;}
.doc-head .dtitle{font-size:13px;color:var(--tx);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;}
.doc-head .mode{font-size:9px;letter-spacing:0.08em;text-transform:uppercase;border:1px solid var(--line-strong);border-radius:3px;padding:1px 5px;color:var(--tx-muted);flex-shrink:0;}
.doc-head .mode.DOC{color:var(--doc);border-color:var(--doc);}.doc-head .mode.ILLUSTRATIVE{color:var(--illu);border-color:var(--illu);}
.doc-head .mode.RESEARCH{color:var(--research);border-color:var(--research);}.doc-head .mode.JOB{color:var(--job);border-color:var(--job);}
.dbtn{flex-shrink:0;width:20px;height:20px;display:flex;align-items:center;justify-content:center;background:transparent;border:1px solid var(--line-strong);border-radius:3px;color:var(--tx-muted);font-size:12px;line-height:1;cursor:pointer;padding:0;}
.dbtn:hover{border-color:var(--line-hover);color:var(--tx);}
.doc-body{flex:1 1 auto;min-height:0;overflow:hidden auto;scrollbar-gutter:stable;padding:18px 20px 22px;overflow-wrap:anywhere;word-break:break-word;}
.doc-body::-webkit-scrollbar{width:8px;}.doc-body::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:4px;}
.doc-empty{color:var(--tx-fainter);font-size:12px;font-style:italic;}
.resize-grip{position:absolute;right:0;bottom:0;width:16px;height:16px;cursor:nwse-resize;background:linear-gradient(135deg,transparent 50%,var(--line-hover) 50%,var(--line-hover) 62%,transparent 62%,transparent 74%,var(--line-hover) 74%,var(--line-hover) 86%,transparent 86%);}

/* document content — render blocks as a clean formatted page (no per-block chrome) */
.b-heading{color:var(--tx);font-weight:600;margin:16px 0 6px;line-height:1.3;}
.b-heading:first-child{margin-top:0;}
h1.b-heading{font-size:20px;}h2.b-heading{font-size:16px;}h3.b-heading{font-size:14px;}
.b-paragraph{font-size:13px;color:var(--tx-soft);margin:8px 0;}
.b-paragraph p{margin:7px 0;}
.b-paragraph ul{margin:6px 0 6px 18px;}
.b-paragraph code{background:var(--bg-raised);border:1px solid var(--line);border-radius:3px;padding:1px 5px;font-size:12px;}
.b-paragraph strong{color:var(--tx);}
.b-paragraph a{color:var(--info-fg);text-decoration:none;}
table.b-table{border-collapse:collapse;width:100%;font-size:12px;margin:8px 0;}
table.b-table th,table.b-table td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top;}
table.b-table th{background:var(--bg-raised);color:var(--tx-soft);font-weight:600;}
.tcaption{font-size:11px;color:var(--tx-dim);margin-top:4px;}
.b-image{max-width:100%;height:auto;display:block;border-radius:var(--r);border:1px solid var(--line);}
.b-pdf{display:block;width:100%;height:68vh;border:1px solid var(--line);border-radius:var(--r);background:#fff;}
/* rich HTML (docx → mammoth). Style its vocabulary for the dark canvas. */
.b-html{font-size:13px;color:var(--tx-soft);line-height:1.55;}
.b-html h1,.b-html h2,.b-html h3,.b-html h4{color:var(--tx);font-weight:600;margin:14px 0 6px;line-height:1.3;}
.b-html h1{font-size:19px;}.b-html h2{font-size:16px;}.b-html h3{font-size:14px;}
.b-html p{margin:7px 0;}
.b-html ul,.b-html ol{margin:6px 0 6px 20px;}
.b-html a{color:var(--info-fg);text-decoration:none;}
.b-html strong{color:var(--tx);}
.b-html img{max-width:100%;height:auto;border-radius:var(--r);margin:6px 0;}
.b-html table{border-collapse:collapse;width:100%;font-size:12px;margin:8px 0;}
.b-html th,.b-html td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top;}
.b-html th{background:var(--bg-raised);color:var(--tx-soft);}
.chart-meta{font-size:11px;color:var(--tx-muted);margin:8px 0 4px;}
.fallback{border:1px dashed var(--line-strong);border-radius:var(--r);padding:8px 10px;margin:8px 0;}
.fallback .cnote{font-size:11px;color:var(--tx-fainter);margin-bottom:4px;}
.fallback pre{font-size:11px;color:var(--tx-dim);white-space:pre-wrap;word-break:break-word;font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;}

/* tray — overlay drawer (the old side list, now collapsible) */
.tray{position:absolute;top:40px;left:0;bottom:0;width:280px;z-index:25;background:var(--bg-deep);border-right:1px solid var(--line);
  transform:translateX(-100%);transition:transform 160ms ease;display:flex;flex-direction:column;}
.tray.open{transform:translateX(0);box-shadow:6px 0 24px rgba(0,0,0,.4);}
.tray .tray-head{padding:10px 14px;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:var(--tx-fainter);border-bottom:1px solid var(--line-faint);}
.tray .tray-rows{flex:1;overflow-y:auto;}
.titem{padding:10px 14px;border-bottom:1px solid var(--line-faint);cursor:pointer;}
.titem:hover{background:var(--bg-panel);}
.titem.active{background:var(--bg-panel);border-left:2px solid var(--accent);padding-left:12px;}
.titem .nm{font-size:13px;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.titem .sub{font-size:11px;color:var(--tx-dim);margin-top:2px;display:flex;gap:7px;align-items:center;}
.titem .mode{font-size:9px;letter-spacing:0.08em;text-transform:uppercase;border:1px solid var(--line-strong);border-radius:3px;padding:1px 5px;color:var(--tx-muted);}
.titem.closed{opacity:.5;}
.titem.closed .nm{color:var(--tx-dim);}
.err{color:#d8c79a;}

/* Meet-in-canvas pane (Slice 6) — a fixed floating panel (NOT on the zoom/pan board) hosting a
   <webview> logged into Zoe's Google. Draggable by its header, resizable; a shield over the webview
   captures the mouse during drag/resize so the embedded content doesn't swallow the events. */
.meetpane{position:fixed;top:58px;width:820px;height:560px;z-index:60;display:flex;flex-direction:column;
  background:#000;border:1px solid var(--accent);border-radius:var(--r-lg);box-shadow:0 16px 54px rgba(0,0,0,.72);overflow:hidden;}
.meetpane[hidden]{display:none;}
.meetpane.minimized{height:auto !important;}
.meetpane.minimized .meet-body,.meetpane .resize-grip{}
.meetpane.minimized .meet-body,.meetpane.minimized .resize-grip{display:none;}
.meet-head{flex-shrink:0;display:flex;align-items:center;gap:9px;padding:8px 12px;background:var(--bg-raised);border-bottom:1px solid var(--line);cursor:grab;user-select:none;}
.meet-head.dragging{cursor:grabbing;}
.meet-head .grip{color:var(--tx-fainter);font-size:13px;}
.meet-head .live{font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--ok-fg);border:1px solid var(--ok-fg);border-radius:3px;padding:1px 5px;flex-shrink:0;}
.meet-head .meet-title{flex:1;font-size:12px;color:var(--tx);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.meet-body{flex:1;position:relative;background:#000;min-height:0;}
.meet-body webview{position:absolute;inset:0;width:100%;height:100%;border:0;display:inline-flex;}
.meet-shield{position:absolute;inset:0;z-index:5;display:none;}
.meetpane.interacting .meet-shield{display:block;}

/* Monitors — a DOCKED hard container on the RIGHT (no longer a floating widget). Fixed to the right edge,
   full height below the topbar, square (no radius), left border + left-edge shadow. The canvas surface
   insets to reserve its column (body.mon-open) so documents on the canvas never sit under it. */
.monitors{position:fixed;top:40px;right:0;bottom:0;width:380px;z-index:55;display:flex;flex-direction:column;
  background:var(--bg-panel);border:0;border-left:1px solid var(--line-strong);box-shadow:-6px 0 22px rgba(0,0,0,.28);overflow:hidden;}
.monitors[hidden]{display:none;}
.monitors #monResize{display:none;}            /* docked → no drag-resize grip */
.mon-head .grip{display:none;}                 /* docked → no drag handle */
body.mon-open .surface{right:380px;}           /* reserve the docked monitor's column so the board never goes under it */

/* People — a DOCKED contact-card rail on the LEFT (mirror of Monitors). Cards waterfall newest-first as
   contacts are discovered from dropped documents; the surface insets (body.ppl-open) to reserve its column. */
.people{position:fixed;top:40px;left:0;bottom:0;width:340px;z-index:55;display:flex;flex-direction:column;
  background:var(--bg-panel);border:0;border-right:1px solid var(--line-strong);box-shadow:6px 0 22px rgba(0,0,0,.28);overflow:hidden;}
.people[hidden]{display:none;}
body.ppl-open .surface{left:340px;}
.ppl-head{flex-shrink:0;display:flex;align-items:center;gap:8px;padding:8px 11px;background:var(--bg-raised);border-bottom:1px solid var(--line);user-select:none;}
.ppl-head .ppl-title{flex:1;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--tx-muted);font-weight:700;}
.ppl-head .ppl-n{font-size:10px;color:var(--tx-dim);}
.ppl-list{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:9px;}
.ppl-empty{color:var(--tx-dim);font-size:12px;text-align:center;padding:24px 12px;line-height:1.5;}
.ppl-card{background:var(--bg-raised);border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:7px;}
.ppl-card.new{animation:pcflash 1.6s ease-out;}
@keyframes pcflash{0%{border-color:#7dd3fc;box-shadow:0 0 0 2px rgba(125,211,252,.25);}100%{border-color:var(--line);box-shadow:none;}}
.pc-head{display:flex;align-items:center;gap:9px;}
.pc-photo{width:38px;height:38px;border-radius:50%;object-fit:cover;flex-shrink:0;background:var(--bg-panel);}
.pc-initials{width:38px;height:38px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:#3a4a6a;color:#fff;font-size:13px;font-weight:700;}
.pc-initials.pc-av-place{background:#2f5d4a;font-size:17px;}
.pc-initials.pc-av-event{background:#5a4633;font-size:17px;}
.pc-initials.pc-av-org{background:#4a3a6a;}
.ppl-place{border-left:2px solid #2f9e6a;} .ppl-event{border-left:2px solid #d98a3a;} .ppl-org{border-left:2px solid #9a7ad9;}
.pc-id{flex:1;min-width:0;}
.pc-name{font-size:13px;font-weight:600;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pc-role{font-size:11px;color:var(--tx-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pc-grade{flex-shrink:0;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;}
.pc-grade.g-A{background:#22C55E;}.pc-grade.g-B{background:#4ade80;color:#052e16;}.pc-grade.g-C{background:#F59E0B;color:#3a2600;}.pc-grade.g-D{background:#94a3b8;color:#1e293b;}.pc-grade.g-E{background:#64748b;}
.pc-rows{display:flex;flex-direction:column;gap:3px;}
.pc-row{font-size:11.5px;color:var(--tx-soft);display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pc-row .pc-ic{color:var(--tx-fainter);width:12px;flex-shrink:0;text-align:center;}
.pc-row a{color:#7dd3fc;text-decoration:none;overflow:hidden;text-overflow:ellipsis;}
.pc-bio{font-size:11px;color:var(--tx-muted);line-height:1.4;max-height:3.2em;overflow:hidden;}
.pc-briefing,.pc-crmbtn{align-self:flex-start;background:transparent;border:1px solid var(--line-strong);color:var(--tx-muted);font:inherit;font-size:11px;padding:3px 9px;border-radius:5px;cursor:pointer;}
.pc-briefing:hover,.pc-crmbtn:hover{border-color:#7dd3fc;color:var(--tx-soft);}
.pc-actions{display:flex;flex-wrap:wrap;gap:6px;}
.pc-can-expand{cursor:pointer;}
.pc-can-expand .pc-head::after{content:'▸';margin-left:auto;color:var(--tx-fainter);font-size:10px;transition:transform .12s;}
.pc-can-expand.pc-expanded .pc-head::after{transform:rotate(90deg);}
.pc-crm{display:none;flex-direction:column;gap:2px;margin-top:2px;padding-top:6px;border-top:1px solid var(--line);}
.pc-expanded .pc-crm{display:flex;}
.pc-crm-row{display:flex;gap:8px;font-size:11px;line-height:1.35;}
.pc-crm-row .k{color:var(--tx-fainter);min-width:76px;flex-shrink:0;}
.pc-crm-row .v{color:var(--tx-soft);word-break:break-word;}
.pc-crm-notes{font-size:11px;color:var(--tx-muted);line-height:1.4;margin-top:3px;white-space:pre-wrap;}
.pc-crm-wiki{font-size:11px;color:#7dd3fc;text-decoration:none;margin-top:3px;}
.mon-head{flex-shrink:0;display:flex;align-items:center;gap:8px;padding:8px 11px;background:var(--bg-raised);border-bottom:1px solid var(--line);cursor:default;user-select:none;}
.mon-head.dragging{cursor:grabbing;}
.mon-head .grip{color:var(--tx-fainter);font-size:13px;}
.mon-head .mon-title{flex:1;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--tx-muted);font-weight:700;}
.mon-head .mon-n{font-size:10px;color:var(--tx-dim);}
#monBrief.pulse{animation:monpulse 1s ease-in-out infinite;}
@keyframes monpulse{0%,100%{opacity:.5}50%{opacity:1}}
.mon-brief{position:fixed;width:400px;z-index:54;display:flex;flex-direction:column;background:var(--bg-panel);border:1px solid var(--line-strong);border-radius:var(--r-lg);box-shadow:0 14px 44px rgba(0,0,0,.6);overflow:hidden;}
.mon-brief[hidden]{display:none;}
.mon-brief-head{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:8px 11px;border-bottom:1px solid var(--line);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--tx-muted);font-weight:700;}
.mon-brief-body{flex:1;overflow-y:auto;padding:12px 14px;font-size:13px;line-height:1.5;color:var(--tx);}
.mon-brief-body h2{font-size:15px;margin:2px 0 8px;} .mon-brief-body h3{font-size:13px;margin:12px 0 3px;} .mon-brief-body h4{font-size:12px;margin:9px 0 2px;color:var(--tx-muted);}
.mon-brief-body p{margin:4px 0;} .mon-brief-body ul{margin:4px 0;padding-left:18px;} .mon-brief-body li{margin:2px 0;}
.mon-brief-body blockquote{margin:4px 0;padding:3px 9px;border-left:2px solid var(--line);color:var(--tx-muted);font-size:12px;}
.mon-brief-body a{color:var(--illu);} .mon-brief-foot{margin-top:14px;padding-top:8px;border-top:1px solid var(--line);font-size:10px;color:var(--tx-dim);}
/* Topic tuner panel */
.mon-tune-body{flex:1;overflow-y:auto;padding:8px 12px;}
.mon-tune-row{display:grid;grid-template-columns:92px 1fr 42px 30px;gap:7px;align-items:center;padding:5px 0;border-bottom:1px solid var(--line-faint);}
.mon-tune-row .tc-name{font-size:11px;color:var(--tx-soft);} .mon-tune-row .tc-name.prot{color:var(--info-fg);font-weight:600;}
.mon-tune-row input[type=range]{width:100%;accent-color:var(--accent);height:3px;}
.mon-tune-row .tc-cap{width:38px;font-size:10px;padding:2px 3px;background:var(--bg-raised);border:1px solid var(--line);border-radius:4px;color:var(--tx-soft);text-align:right;}
.mon-tune-row .tc-prot{cursor:pointer;font-size:12px;text-align:center;opacity:.4;} .mon-tune-row .tc-prot.on{opacity:1;}
.mon-tune-row .tc-mute{font-size:9px;color:var(--tx-fainter);}
.mon-tune-foot{flex-shrink:0;border-top:1px solid var(--line);padding:8px 12px;display:flex;flex-direction:column;gap:7px;}
.mon-tune-reserved{font-size:10px;color:var(--tx-dim);} .mon-tune-reserved input{width:38px;background:var(--bg-raised);border:1px solid var(--line);border-radius:4px;color:var(--tx-soft);font-size:10px;padding:2px 3px;text-align:right;}
.mon-tune-actions{display:flex;gap:8px;justify-content:flex-end;align-items:center;}
.mon-tune-hd{display:grid;grid-template-columns:92px 1fr 42px 30px;gap:7px;font-size:9px;color:var(--tx-fainter);text-transform:uppercase;letter-spacing:.08em;padding-bottom:3px;border-bottom:1px solid var(--line);}
.mon-item .it-cat{color:var(--tx-fainter);font-size:9px;text-transform:uppercase;letter-spacing:.03em;}
.mon-bar{flex-shrink:0;display:flex;gap:6px;padding:7px 10px;border-bottom:1px solid var(--line-faint);}
.mon-bar input{flex:1;background:var(--bg-deep);border:1px solid var(--line-strong);color:var(--tx);font:inherit;font-size:11px;padding:5px 8px;border-radius:var(--r-sm);outline:none;}
.mon-bar input:focus{border-color:var(--accent);}
.mon-bar button{background:var(--bg-deep);border:1px solid var(--line-strong);color:var(--tx-muted);font:inherit;font-size:11px;padding:5px 9px;border-radius:var(--r-sm);cursor:pointer;}
.mon-bar button:hover{border-color:var(--line-hover);color:var(--tx-soft);}
.mon-list{flex:1;overflow-y:auto;padding:4px 6px 10px;}
.mon-list::-webkit-scrollbar{width:8px;}.mon-list::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:4px;}
.mon-item{padding:7px 9px;border-bottom:1px solid var(--line-faint);position:relative;}
.mon-item.new{background:rgba(106,134,182,.08);}
.mon-item.new::before{content:"";position:absolute;left:2px;top:11px;width:5px;height:5px;border-radius:50%;background:var(--accent);}
.mon-item .it-top{display:flex;gap:7px;align-items:baseline;font-size:10px;color:var(--tx-dim);margin-bottom:2px;}
.mon-item .it-src{color:var(--info-fg);font-weight:600;}
.mon-item .it-dup{color:var(--tx-fainter);background:var(--line-faint);border-radius:8px;padding:0 5px;font-size:9px;font-weight:600;letter-spacing:.02em;cursor:default;}
.mon-item .it-ago{margin-left:auto;font-variant-numeric:tabular-nums;}
.mon-item .it-title{font-size:12.5px;color:var(--tx-soft);line-height:1.35;}
.mon-item .it-title a{color:var(--tx-soft);text-decoration:none;}
.mon-item .it-title a:hover{color:var(--tx);text-decoration:underline;}
.mon-item .it-sum{font-size:11px;color:var(--tx-fainter);margin-top:2px;line-height:1.35;max-height:46px;overflow:hidden;}
.mon-empty{padding:16px 10px;font-size:11px;color:var(--tx-fainter);text-align:center;}
.mon-srchead{flex-shrink:0;display:flex;align-items:center;gap:6px;padding:4px 10px;border-top:1px solid var(--line-faint);font-size:10px;letter-spacing:.04em;color:var(--tx-dim);cursor:pointer;user-select:none;}
.mon-srchead:hover{color:var(--tx-muted);}
.mon-srchead .chev{margin-left:auto;font-size:9px;color:var(--tx-fainter);}
.mon-sources{flex-shrink:0;max-height:104px;overflow-y:auto;padding:6px 10px;display:flex;flex-wrap:wrap;gap:5px;}
.mon-sources.collapsed{display:none;}
.mon-src{font-size:10px;color:var(--tx-muted);background:var(--bg-raised);border:1px solid var(--line-strong);border-radius:9px;padding:1px 7px 1px 8px;display:inline-flex;gap:5px;align-items:center;cursor:default;}
.mon-src .x{color:var(--tx-fainter);cursor:pointer;font-size:11px;}
.mon-src .x:hover{color:#e08a8a;}
.mon-src.bad{border-color:#4a3a22;color:var(--warn-fg);}
.mon-list{min-height:0;}
.mon-videos{flex-shrink:0;border-top:1px solid var(--line);overflow-y:auto;padding:6px;display:flex;flex-direction:column;gap:7px;}
.mon-videos:empty{display:none;}
.mon-videos::-webkit-scrollbar{width:8px;}.mon-videos::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:4px;}
.vid{position:relative;}
.vid webview{width:100%;height:204px;border:0;border-radius:var(--r);background:#000;display:flex;}
.vid .vx{position:absolute;top:5px;right:5px;background:rgba(0,0,0,.62);color:#fff;border:0;border-radius:3px;font-size:13px;line-height:1;width:20px;height:20px;cursor:pointer;z-index:2;}
.vid .vx:hover{background:rgba(200,70,70,.85);}
.vid .vspk{position:absolute;top:5px;left:5px;background:rgba(0,0,0,.62);border:0;border-radius:3px;font-size:11px;line-height:1;height:20px;padding:0 6px;cursor:pointer;z-index:2;}
.vid .vspk:hover{background:rgba(0,0,0,.85);}
.vid .ving{position:absolute;top:5px;left:40px;background:rgba(0,0,0,.62);color:#fff;border:0;border-radius:3px;font-size:12px;line-height:1;height:20px;padding:0 6px;cursor:pointer;z-index:2;}
.vid .ving:hover{background:var(--illu);color:#0a0a0d;}
</style>
</head>
<body>
  <div class="topbar">
    <button id="trayBtn" title="Documents tray">☰ documents</button>
    <span class="brand">Zoe's Canvas</span>
    <span class="count" id="count"></span>
    <span class="spacer"></span>
    <span class="hint">scroll = zoom · drag bg = pan · drag ⠿ = move</span>
    <button id="peopleBtn" title="People — contacts discovered from documents">👥 people</button>
    <button id="monitorsBtn" title="News monitors">📡 monitors</button>
    <button id="resetBtn" title="Reset arrangement">reset layout</button>
    <button id="refreshBtn">Refresh</button>
  </div>

  <aside class="tray" id="tray">
    <div class="tray-head">Documents</div>
    <div class="tray-rows" id="trayRows"></div>
  </aside>

  <div class="surface" id="surface">
    <div class="board" id="board"></div>
    <div class="surface-msg" id="msg">Loading canvas…</div>
    <div class="toast" id="toast"></div>
  </div>

  <div class="meetpane" id="meetpane" hidden>
    <div class="meet-head" id="meetHead">
      <span class="grip">⠿</span>
      <span class="live">● live</span>
      <span class="meet-title" id="meetTitle">Google Meet</span>
      <button class="dbtn" id="meetReload" title="Reload">⟳</button>
      <button class="dbtn" id="meetMin" title="Minimize">–</button>
      <button class="dbtn" id="meetClose" title="Leave &amp; close">✕</button>
    </div>
    <div class="meet-body" id="meetBody"><div class="meet-shield" id="meetShield"></div></div>
    <div class="resize-grip" id="meetResize"></div>
  </div>

  <div class="people" id="people" hidden>
    <div class="ppl-head">
      <span class="ppl-title">People · Places · Events</span>
      <span class="ppl-n" id="pplN"></span>
      <button class="dbtn" id="pplClose" title="Close">✕</button>
    </div>
    <div class="ppl-list" id="pplList"><div class="ppl-empty">No contacts yet.<br>Drop a roster on the canvas.</div></div>
  </div>

  <div class="monitors" id="monitors" hidden>
    <div class="mon-head" id="monHead">
      <span class="grip">⠿</span>
      <span class="mon-title">Monitors</span>
      <span class="mon-n" id="monN"></span>
      <button class="dbtn" id="monBrief" title="News briefing — what's going on right now">📰</button>
      <button class="dbtn" id="monTune" title="Tune topics — weight, cap, reserve hard-news slots">⚙</button>
      <button class="dbtn" id="monRefresh" title="Refresh now">⟳</button>
      <button class="dbtn" id="monClose" title="Close">✕</button>
    </div>
    <div class="mon-bar">
      <input type="text" id="monAdd" placeholder="Add RSS/Atom feed or YouTube URL…" autocomplete="off" spellcheck="false">
      <button id="monAddBtn">Add</button>
    </div>
    <div class="mon-list" id="monList"></div>
    <div class="mon-srchead" id="monSrcHead"><span id="monSrcLbl">sources</span><span class="chev" id="monSrcChev">▸</span></div>
    <div class="mon-sources collapsed" id="monSources"></div>
    <div class="mon-videos" id="monVideos"></div>
    <div class="resize-grip" id="monResize"></div>
  </div>

  <!-- News Briefing drawer — a sibling of .monitors (which clips overflow); JS pins it beside the monitor. -->
  <div class="mon-brief" id="monTunePanel" hidden>
    <div class="mon-brief-head"><span>⚙ Topic Tuner</span><button class="dbtn" id="monTuneClose" title="Close">✕</button></div>
    <div class="mon-tune-body" id="monTuneBody"></div>
    <div class="mon-tune-foot">
      <label class="mon-tune-reserved">Reserved hard-news slots — feed <input type="number" id="monTuneRsvFeed" min="0" max="30" step="1"> · brief <input type="number" id="monTuneRsvBrief" min="0" max="12" step="1"></label>
      <div class="mon-tune-actions"><button class="dbtn" id="monTuneReset" title="Restore defaults">reset</button><button id="monTuneSave">Save</button></div>
    </div>
  </div>

  <div class="mon-brief" id="monBriefPanel" hidden>
    <div class="mon-brief-head"><span>📰 News Briefing</span><button class="dbtn" id="monBriefClose" title="Close">✕</button></div>
    <div class="mon-brief-body" id="monBriefBody"></div>
  </div>

  <div class="meetpane" id="ingestpane" hidden>
    <div class="meet-head" id="ingestHead">
      <span class="grip">⠿</span>
      <span class="live" style="color:var(--illu);border-color:var(--illu)">● ingesting</span>
      <span class="meet-title" id="ingestTitle">Full ingestion</span>
      <button class="dbtn" id="ingestReload" title="Reload">⟳</button>
      <button class="dbtn" id="ingestClose" title="Close">✕</button>
    </div>
    <div class="meet-body" id="ingestBody"><div class="meet-shield" id="ingestShield"></div></div>
    <div class="resize-grip" id="ingestResize"></div>
  </div>

  <script src="../studio/feeds_view.js"></script>
  <script src="../lib/news_topics.js"></script>
  <script src="../lib/news_rank.js"></script>
  <script src="canvas.js"></script>
</body>
</html>
