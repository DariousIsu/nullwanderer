<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Polling</title>
<style>
/* === Polling surface — canonical dark kit (mirrors editor.html / search.html) ============== */
:root{
  --bg:#0d0d10;--bg-deep:#0a0a0d;--bg-panel:#121218;--bg-raised:#1a1a20;
  --line-faint:#15151a;--line:#1f1f24;--line-strong:#2a2a30;--line-hover:#4a4a52;
  --tx:#e8e8eb;--tx-soft:#d8d8db;--tx-muted:#9a9aa3;--tx-dim:#6a6a73;--tx-fainter:#4a4a52;--tx-ghost:#2a2a30;
  --accent:#6a86b6;--accent-soft:#3a4a66;
  --ok-fg:#a8d8a8;--ok-bg:#1b271b;--ok-line:#4a7a4a;
  --warn-fg:#d8c79a;--warn-bg:#28231a;--warn-line:#8a7440;
  --bad-fg:#d8a0a0;--bad-bg:#281a1a;--bad-line:#8a4a4a;
  --info-fg:#9ab2cc;--info-bg:#1a222e;--info-line:#4a6480;
  --bar:#4a6088;--bar-max:#6a86b6;
  --r-sm:3px;--r:4px;--r-lg:6px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:var(--bg);color:var(--tx-soft);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Inter",system-ui,sans-serif;font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;}
[hidden]{display:none !important;}
.studio{height:100vh;display:flex;flex-direction:column;overflow:hidden;}
.studio-head{flex-shrink:0;display:flex;align-items:center;gap:14px;padding:14px 22px;border-bottom:1px solid var(--line-faint);}
.studio-id{display:flex;align-items:center;gap:11px;}
.studio-mark{font-size:16px;color:var(--tx-dim);}
.studio-title{font-size:10px;letter-spacing:0.2em;text-transform:uppercase;color:var(--tx-muted);}
.studio-sub{font-size:11px;color:var(--tx-fainter);letter-spacing:0.04em;}
.spacer{flex:1;}
.seg{display:flex;border:1px solid var(--line-strong);border-radius:var(--r);overflow:hidden;}
.seg button{background:transparent;border:0;color:var(--tx-dim);font:inherit;font-size:11px;padding:6px 11px;cursor:pointer;}
.seg button.on{background:var(--bg-raised);color:var(--tx-soft);}
.seg button:not(:last-child){border-right:1px solid var(--line-strong);}
.btn{background:transparent;border:1px solid var(--line-strong);color:var(--tx-muted);font:inherit;font-size:12px;padding:6px 12px;border-radius:var(--r-sm);cursor:pointer;}
.btn:hover{border-color:var(--line-hover);color:var(--tx-soft);}
.btn.on{border-color:var(--info-line);color:var(--info-fg);background:var(--info-bg);}

/* layout */
.main{flex:1;display:flex;min-height:0;}
.list{width:300px;flex-shrink:0;border-right:1px solid var(--line);display:flex;flex-direction:column;background:var(--bg-deep);}
.list .search{padding:10px 12px;border-bottom:1px solid var(--line-faint);}
.list .search input{width:100%;background:var(--bg);border:1px solid var(--line-strong);color:var(--tx);font:inherit;font-size:12px;padding:7px 10px;border-radius:var(--r);outline:none;}
.list .search input:focus{border-color:var(--accent);}
.list .rows{flex:1;overflow-y:auto;}
.list .rows::-webkit-scrollbar,.detail::-webkit-scrollbar{width:7px;}
.list .rows::-webkit-scrollbar-thumb,.detail::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:4px;}
.fitem{padding:9px 13px;border-bottom:1px solid var(--line-faint);cursor:pointer;transition:background 120ms;}
.fitem:hover{background:var(--bg-panel);}
.fitem.active{background:var(--bg-panel);border-left:2px solid var(--accent);padding-left:11px;}
.fitem .t{font-size:13px;color:var(--tx);font-weight:500;}
.fitem .m{font-size:10.5px;color:var(--tx-dim);margin-top:2px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.src{font-size:8.5px;letter-spacing:0.08em;text-transform:uppercase;padding:1px 6px;border-radius:9px;border:1px solid var(--line-strong);color:var(--tx-dim);background:var(--bg-raised);}
.src.rainey{color:var(--info-fg);border-color:var(--info-line);background:var(--info-bg);}
.dot{width:5px;height:5px;border-radius:50%;background:var(--warn-fg);display:inline-block;}

.detail{flex:1;overflow-y:auto;padding:20px 26px 48px;min-width:0;}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--tx-dim);text-align:center;gap:6px;}
.empty .big{font-size:15px;color:var(--tx-muted);}
.empty .small{font-size:12px;color:var(--tx-fainter);max-width:380px;}

/* fielding card */
.card-h{font-size:18px;color:var(--tx);font-weight:600;margin-bottom:4px;}
.card-meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--tx-muted);margin:8px 0 4px;}
.card-meta b{color:var(--tx-soft);font-weight:600;}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0;}
.chip{font-size:10.5px;color:var(--tx-muted);background:var(--bg-raised);border:1px solid var(--line-strong);border-radius:10px;padding:2px 9px;}
.chip.file{color:var(--tx-dim);}
.note{font-size:12px;color:var(--tx-dim);line-height:1.6;margin:8px 0 0;border-left:2px solid var(--line-strong);padding-left:10px;}
.qcount{font-size:11px;color:var(--tx-fainter);text-transform:uppercase;letter-spacing:0.1em;margin:22px 0 10px;border-bottom:1px solid var(--line-faint);padding-bottom:6px;}

/* questions + topline bars */
.q{margin-bottom:20px;}
.q .w{font-size:13.5px;color:var(--tx-soft);margin-bottom:8px;}
.q .w .n{color:var(--tx-fainter);margin-right:7px;font-variant-numeric:tabular-nums;}
.opt{display:flex;align-items:center;gap:10px;margin:4px 0;}
.opt .lbl{width:230px;flex-shrink:0;font-size:12px;color:var(--tx-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.opt .track{flex:1;background:var(--bg-raised);border-radius:3px;height:16px;overflow:hidden;}
.opt .fill{height:100%;background:var(--bar);border-radius:3px;}
.opt.max .fill{background:var(--bar-max);}
.opt.net .lbl{color:var(--tx-dim);font-style:italic;}
.opt.net .track{background:transparent;}
.opt .pct{width:42px;text-align:right;font-size:12px;color:var(--tx-soft);font-variant-numeric:tabular-nums;}

/* issues */
.issues{padding:18px 26px;}
.irow{display:flex;align-items:flex-start;gap:12px;padding:11px 0;border-bottom:1px solid var(--line-faint);}
.pill{font-size:9px;letter-spacing:0.08em;text-transform:uppercase;padding:2px 8px;border-radius:10px;border:1px solid transparent;flex-shrink:0;}
.pill.bad{color:var(--bad-fg);background:var(--bad-bg);border-color:var(--bad-line);}
.pill.warn{color:var(--warn-fg);background:var(--warn-bg);border-color:var(--warn-line);}
.pill.info{color:var(--info-fg);background:var(--info-bg);border-color:var(--info-line);}
.irow .ibody{min-width:0;}
.irow .ik{font-size:12.5px;color:var(--tx-soft);}
.irow .id{font-size:11.5px;color:var(--tx-dim);margin-top:2px;}
.irow .if{font-size:10.5px;color:var(--tx-fainter);font-family:ui-monospace,Menlo,Consolas,monospace;margin-top:3px;}
.status{padding:16px 26px;color:var(--tx-dim);font-size:12px;}
.err{padding:16px 26px;color:var(--warn-fg);font-size:12px;}
</style>
</head>
<body>
  <div class="studio">
    <div class="studio-head">
      <div class="studio-id"><span class="studio-mark">&#9776;</span><div><div class="studio-title">Polling</div><div class="studio-sub">Fieldings · toplines · triage</div></div></div>
      <div class="spacer"></div>
      <div class="seg" id="srcseg" title="Filter by source">
        <button data-src="" class="on">All</button>
        <button data-src="rainey">Rainey</button>
        <button data-src="538">538</button>
        <button data-src="pew">Pew</button>
      </div>
      <button class="btn" id="issuesBtn">Issues</button>
    </div>
    <div class="main">
      <div class="list">
        <div class="search"><input id="q" type="text" placeholder="Filter fieldings…" autocomplete="off" spellcheck="false"></div>
        <div class="rows" id="rows"><div class="status">Loading fieldings…</div></div>
      </div>
      <div class="detail" id="detail">
        <div class="empty"><div class="big">Polling</div><div class="small">Select a fielding to see its methodology and topline results. The Issues button shows the extraction triage feed.</div></div>
      </div>
    </div>
  </div>
  <script src="polling.js"></script>
</body>
</html>
