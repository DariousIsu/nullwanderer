<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Knowledge Graph — 3D</title>
  <style>
    html, body { margin: 0; height: 100%; background: #06070b; overflow: hidden; color: #cbd5e1;
                 font: 13px system-ui, -apple-system, Segoe UI, sans-serif; }
    #graph3d { position: absolute; inset: 0; }
    .head { position: fixed; top: 0; left: 0; right: 0; z-index: 12; display: flex; align-items: center; gap: 10px;
            padding: 8px 12px; background: linear-gradient(#06070bcc, #06070b00); pointer-events: none; }
    .head > * { pointer-events: auto; }
    .mark { color: #a78bfa; font-size: 15px; } .title { font-weight: 600; color: #e2e8f0; letter-spacing: .2px; }
    .qwrap { position: relative; }
    #q { width: 260px; background: #0d1017; border: 1px solid #232a36; color: #dbe4f0; border-radius: 7px;
         padding: 6px 10px; font-size: 12.5px; outline: none; }
    #q:focus { border-color: #3b4658; }
    .dd { position: absolute; top: 34px; left: 0; width: 300px; max-height: 320px; overflow-y: auto; z-index: 20;
          background: #0d1017; border: 1px solid #232a36; border-radius: 8px; box-shadow: 0 12px 30px #000a; }
    .dd .hit { display: flex; align-items: center; gap: 7px; padding: 6px 10px; cursor: pointer; font-size: 12.5px; }
    .dd .hit.on, .dd .hit:hover { background: #161b25; }
    .dd .swatch { width: 8px; height: 8px; border-radius: 50%; flex: none; }
    .dd .nm { color: #dbe4f0; } .dd .ty { color: #64748b; font-size: 11px; margin-left: auto; }
    .btn { background: #0d1017; border: 1px solid #232a36; color: #9fb0c4; border-radius: 7px; padding: 6px 11px;
           font-size: 12px; cursor: pointer; }
    .btn:hover { border-color: #3b4658; color: #dbe4f0; }
    .btn.on { border-color: #a78bfa; color: #c4b5fd; background: #a78bfa1a; }
    .lbl { color: #64748b; font-size: 11.5px; } .lbl select { background: #0d1017; border: 1px solid #232a36; color: #9fb0c4; border-radius: 5px; padding: 2px 4px; }
    #overlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; z-index: 20;
               color: #9fb2c8; pointer-events: none; text-shadow: 0 1px 3px #000; }
    #hud { position: fixed; bottom: 8px; left: 12px; z-index: 10; font: 11px ui-monospace, monospace;
           color: #8fb; background: rgba(0,0,0,.4); padding: 3px 8px; border-radius: 5px; opacity: .75; }
    /* right-side dock: a live, color-coded running log of every memory (short + long term) DB action */
    #logdock { position: fixed; top: 0; right: 0; width: 340px; height: 100vh; z-index: 14; display: flex; flex-direction: column;
               background: linear-gradient(#0a0c12f7, #0a0c12ee); border-left: 1px solid #1c2330; box-shadow: -14px 0 34px #0007; }
    #logdock.hidden { display: none; }
    #logdock .lh { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid #1c2330;
                   font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: #8395ad; }
    #logdock .lh .dot { width: 7px; height: 7px; border-radius: 50%; background: #34d399; box-shadow: 0 0 7px #34d399; animation: lpulse 2s ease-in-out infinite; }
    @keyframes lpulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
    #logdock .lh .sp { margin-left: auto; color: #4a5568; font-size: 10px; text-transform: none; letter-spacing: 0; }
    #logdock .lh .lg { display: flex; gap: 9px; font-size: 9px; text-transform: none; letter-spacing: 0; }
    #logdock .lh .lg b { font-weight: 700; } #logdock .lh .lg .v { color: #c4b5fd; } #logdock .lh .lg .s { color: #7dd3fc; }
    #logfeed { flex: 1; overflow-y: auto; padding: 3px 0; font: 11.5px ui-monospace, SFMono-Regular, monospace; }
    #logfeed::-webkit-scrollbar { width: 8px; } #logfeed::-webkit-scrollbar-thumb { background: #232a36; border-radius: 4px; }
    .logrow { display: flex; align-items: flex-start; flex-wrap: wrap; gap: 3px 7px; padding: 3px 12px 4px 10px; border-left: 2px solid transparent; line-height: 1.45; }
    .logrow:hover { background: #ffffff08; }
    .logrow .t { color: #47526a; font-size: 10px; flex: none; padding-top: 1px; }
    .logrow .db { flex: none; font-size: 9px; font-weight: 700; padding: 1px 4px; border-radius: 3px; letter-spacing: .04em; }
    .logrow .db.st { color: #c4b5fd; background: #a78bfa26; } .logrow .db.lt { color: #7dd3fc; background: #38bdf826; }
    .logrow .k { flex: none; font-weight: 600; }
    /* an event that produced no gesture is dimmed and says so, so the log never silently outruns the picture */
    .logrow.nodraw { opacity: .48; }
    .logrow .nd { flex: none; font-size: 9px; color: #6b7789; border: 1px solid #33405480; border-radius: 3px; padding: 0 3px; letter-spacing: .03em; }
    /* elegant wrap: the anchor text takes the rest of the row and wraps onto indented continuation lines */
    .logrow .a { color: #8b98ad; flex: 1 1 100%; min-width: 0; margin-left: 24px; white-space: normal; overflow-wrap: anywhere; word-break: break-word; }
    /* hover tooltip: what a node IS, at a glance, following the cursor */
    #tip { position: fixed; z-index: 18; display: none; max-width: 340px; pointer-events: none;
           background: #0d1017f2; border: 1px solid #232a36; border-radius: 8px; padding: 7px 10px;
           box-shadow: 0 10px 26px #000a; line-height: 1.4; }
    #tip .nm { color: #e2e8f0; font-weight: 600; font-size: 12.5px; overflow-wrap: anywhere; }
    #tip .meta { color: #64748b; font-size: 10.5px; margin-top: 1px; }
    #tip .meta b { font-weight: 600; }
    /* node card: everything known about the clicked node, bottom-left, out of the orbit path */
    #card { position: fixed; left: 12px; bottom: 34px; z-index: 16; width: 330px; display: none;
            background: #0c0f16f5; border: 1px solid #232a36; border-radius: 10px; padding: 11px 13px 10px;
            box-shadow: 0 14px 36px #000b; }
    #card .cx { position: absolute; top: 6px; right: 9px; color: #4a5568; cursor: pointer; font-size: 14px; }
    #card .cx:hover { color: #9fb0c4; }
    #card .nm { color: #e8eef7; font-weight: 650; font-size: 13.5px; padding-right: 18px; overflow-wrap: anywhere; }
    #card .chips { display: flex; flex-wrap: wrap; gap: 5px; margin: 7px 0 2px; }
    #card .chip { font-size: 9.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
                  padding: 2px 7px; border-radius: 9px; background: #ffffff10; color: #9fb0c4; }
    #card .sum { color: #93a1b5; font-size: 11.5px; margin-top: 7px; line-height: 1.5; max-height: 110px; overflow-y: auto; overflow-wrap: anywhere; }
    #card .ev { margin-top: 8px; border-top: 1px solid #1c2330; padding-top: 7px; font-size: 11px; color: #7b8aa0; line-height: 1.55; }
    #card .ev b { color: #a9b8cc; font-weight: 600; }
    #card .ev .warn { color: #f87171; }
  </style>
</head>
<body>
  <div id="graph3d"></div>
  <div class="head">
    <span class="mark">&#9737;</span><span class="title">Knowledge Graph</span>
    <div class="qwrap"><input id="q" type="text" placeholder="Focus an entity… (fuzzy search)" autocomplete="off" spellcheck="false"><div class="dd" id="dd" hidden></div></div>
    <label class="lbl">hops <select id="hops"><option value="1">1</option><option value="2" selected>2</option><option value="3">3</option><option value="4">4</option></select></label>
    <label class="lbl">shape <select id="shape" title="How the two memories are arranged in space"><option value="skin">skin</option><option value="brain">brain</option><option value="corona">corona</option><option value="halves">halves</option><option value="binary">binary</option><option value="free">free</option></select></label>
    <button class="btn" id="backBtn" hidden>&larr; overview</button>
    <button class="btn" id="followBtn" title="Follow — fly to eruptions + the idle graph-walk">Follow &#9654;</button>
    <button class="btn on" id="faceBtn" title="Her face, painted across the cloud in light — the map talks when she talks">Face</button>
    <button class="btn on" id="logBtn" title="Toggle the live memory-activity log">Log</button>
  </div>
  <div id="overlay">Loading corpus…</div>
  <div id="hud"></div>
  <div id="tip"><div class="nm"></div><div class="meta"></div></div>
  <div id="card"><span class="cx" id="cardClose">&times;</span><div class="nm"></div><div class="chips"></div><div class="sum"></div><div class="ev"></div></div>
  <div id="logdock">
    <div class="lh"><span class="dot"></span>Memory activity<span class="lg"><span class="v"><b>ST</b> short</span><span class="s"><b>LT</b> long</span></span><span class="sp" id="logcount">0</span></div>
    <div id="logfeed"></div>
  </div>
  <script src="vendor/kg3d.bundle.js"></script>
  <!-- the SAME face model the avatar runs (UMD → window.AvatarState): expression presets, the amplitude→mouth
       lip-sync curve and the blink clock. One source of truth, so the two faces can never drift apart. -->
  <script src="../lib/avatar_state.js"></script>
  <script src="kg3d.js"></script>
</body>
</html>
