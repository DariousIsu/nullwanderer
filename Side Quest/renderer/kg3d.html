<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Knowledge Graph — 3D</title>
  <style>
    html, body { margin: 0; height: 100%; background: #06070b; overflow: hidden; color: #cbd5e1;
                 font: 13px system-ui, -apple-system, Segoe UI, sans-serif; }
    #graph3d { position: absolute; inset: 0; }
    #overlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
               z-index: 20; color: #9fb2c8; font-size: 13px; pointer-events: none;
               text-shadow: 0 1px 3px #000; }
    #hud { position: fixed; top: 10px; left: 12px; z-index: 10; font: 11px ui-monospace, monospace;
           color: #8fb; background: rgba(0,0,0,.4); padding: 4px 8px; border-radius: 5px; opacity: .8; }
  </style>
</head>
<body>
  <div id="graph3d"></div>
  <div id="overlay">Loading corpus…</div>
  <div id="hud"></div>
  <script src="vendor/kg3d.bundle.js"></script>
  <script src="kg3d.js"></script>
</body>
</html>
