<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Legislation</title>
<style>
/* === Legislation surface — canonical dark kit (mirrors crm.html) ========================== */
:root{
  --bg:#0d0d10;--bg-deep:#0a0a0d;--bg-panel:#121218;--bg-raised:#1a1a20;
  --line-faint:#15151a;--line:#1f1f24;--line-strong:#2a2a30;--line-hover:#4a4a52;
  --tx:#e8e8eb;--tx-soft:#d8d8db;--tx-muted:#9a9aa3;--tx-dim:#6a6a73;--tx-fainter:#4a4a52;
  --accent:#6a86b6;--ok-fg:#a8d8a8;--bad-fg:#d8a0a0;--info-fg:#9ab2cc;
  --r-sm:3px;--r:4px;--r-lg:6px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:var(--bg);color:var(--tx-soft);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Inter",system-ui,sans-serif;font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;}
[hidden]{display:none !important;}
.studio{height:100vh;display:flex;flex-direction:column;overflow:hidden;}
.studio-head{flex-shrink:0;display:flex;align-items:center;gap:10px;padding:13px 20px;border-bottom:1px solid var(--line-faint);flex-wrap:wrap;}
.studio-id{display:flex;align-items:center;gap:10px;}
.studio-mark{font-size:16px;color:var(--tx-dim);}
.studio-title{font-size:10px;letter-spacing:0.2em;text-transform:uppercase;color:var(--tx-muted);}
.studio-sub{font-size:11px;color:var(--tx-fainter);}
.spacer{flex:1;}
.qbox{position:relative;min-width:200px;}
.qbox input{width:100%;background:var(--bg-deep);border:1px solid var(--line-strong);color:var(--tx);font:inherit;font-size:13px;padding:7px 11px;border-radius:var(--r);outline:none;}
.qbox input:focus{border-color:var(--accent);}
select{background:var(--bg-deep);border:1px solid var(--line-strong);color:var(--tx-soft);font:inherit;font-size:12px;padding:6px 8px;border-radius:var(--r-sm);outline:none;max-width:140px;}
select:focus{border-color:var(--accent);}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:8px 20px;border-bottom:1px solid var(--line-faint);}
.chips:empty{display:none;}
.fchip{font-size:11px;color:var(--tx-muted);background:var(--bg-raised);border:1px solid var(--line-strong);border-radius:11px;padding:2px 8px 2px 10px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;}
.fchip:hover{border-color:var(--line-hover);color:var(--tx-soft);}
.fchip .x{color:var(--tx-fainter);font-size:13px;}

.main{flex:1;display:flex;min-height:0;}
.list{width:380px;flex-shrink:0;border-right:1px solid var(--line);display:flex;flex-direction:column;background:var(--bg-deep);}
.list .head{padding:8px 14px;font-size:11px;color:var(--tx-dim);border-bottom:1px solid var(--line-faint);}
.list .rows{flex:1;overflow-y:auto;}
.list .rows::-webkit-scrollbar,.detail::-webkit-scrollbar{width:7px;}
.list .rows::-webkit-scrollbar-thumb,.detail::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:4px;}
.bitem{padding:10px 14px;border-bottom:1px solid var(--line-faint);cursor:pointer;}
.bitem:hover{background:var(--bg-panel);}
.bitem.active{background:var(--bg-panel);border-left:2px solid var(--accent);padding-left:12px;}
.bitem .nm{font-size:12.5px;color:var(--tx);font-weight:500;}
.bitem .sm{font-size:11.5px;color:var(--tx-dim);margin-top:3px;line-height:1.45;max-height:2.9em;overflow:hidden;}
.bitem .mt{font-size:10.5px;color:var(--tx-fainter);margin-top:4px;display:flex;gap:9px;flex-wrap:wrap;}
.more{padding:10px 14px;text-align:center;}
.more button{background:transparent;border:1px solid var(--line-strong);color:var(--tx-muted);font:inherit;font-size:12px;padding:6px 14px;border-radius:var(--r-sm);cursor:pointer;}
.more button:hover{border-color:var(--line-hover);color:var(--tx-soft);}

.detail{flex:1;overflow-y:auto;padding:22px 28px 48px;min-width:0;}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--tx-dim);text-align:center;gap:6px;}
.empty .big{font-size:15px;color:var(--tx-muted);}
.empty .small{font-size:12px;color:var(--tx-fainter);max-width:380px;}
.b-name{font-size:19px;color:var(--tx);font-weight:600;}
.b-meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--tx-muted);margin:10px 0;}
.b-meta b{color:var(--tx-soft);font-weight:600;}
.b-summary{font-size:13.5px;color:var(--tx-soft);line-height:1.65;margin:14px 0;}
.sec{margin-top:20px;}
.sec .h{font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:var(--tx-dim);border-bottom:1px solid var(--line-faint);padding-bottom:6px;margin-bottom:10px;display:flex;justify-content:space-between;}
.sp{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:12.5px;}
.sp .nm{color:var(--tx-soft);}
.sp .meta{color:var(--tx-dim);font-size:11px;}
.sp .lk{font-size:9px;letter-spacing:0.06em;text-transform:uppercase;color:var(--info-fg);border:1px solid var(--info-fg);border-radius:8px;padding:0 6px;opacity:0.7;}
.votes{display:flex;gap:18px;font-size:13px;}
.votes .y{color:var(--ok-fg);}.votes .n{color:var(--bad-fg);}
.status{padding:16px;color:var(--tx-dim);font-size:12px;}
.err{padding:16px;color:#d8c79a;font-size:12px;}
</style>
</head>
<body>
  <div class="studio">
    <div class="studio-head">
      <div class="studio-id"><span class="studio-mark">&#167;</span><div><div class="studio-title">Legislation</div><div class="studio-sub">Bills</div></div></div>
      <div class="spacer"></div>
      <div class="qbox"><input id="q" type="text" placeholder="Search bill text…" autocomplete="off" spellcheck="false"></div>
      <select id="f-state"><option value="">State</option></select>
      <select id="f-session"><option value="">Session</option></select>
      <select id="f-bill_type"><option value="">Type</option></select>
      <select id="f-chamber_origin"><option value="">Chamber</option></select>
      <select id="f-year"><option value="">Year</option></select>
    </div>
    <div class="chips" id="chips"></div>
    <div class="main">
      <div class="list">
        <div class="head" id="listhead">Filter or search to begin…</div>
        <div class="rows" id="rows"></div>
      </div>
      <div class="detail" id="detail">
        <div class="empty"><div class="big">Legislation</div><div class="small">~1.46M bills. Filter by state / session / type / chamber / year, or search bill text, then select a bill for its summary, sponsors, and votes.</div></div>
      </div>
    </div>
  </div>
  <script src="legislation.js"></script>
</body>
</html>
