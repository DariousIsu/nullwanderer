<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zoe Lane</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <div id="chat-pane">
      <div id="approvals-bar" class="hidden" aria-live="polite"></div>
      <div id="transcript" aria-live="polite"></div>
      <div id="composer">
        <div id="attachments-bar"></div>
        <textarea id="input" placeholder="Begin." rows="1" autofocus></textarea>
        <div id="composer-controls">
          <button id="mic-btn" type="button" title="Push to talk — tap, speak, tap again to send">🎤 speak</button>
          <button id="convo-btn" type="button" title="Hands-free conversation — she listens continuously">🎙️ conversation</button>
          <button id="enroll-btn" type="button" title="Teach her your voice — she'll respond only to you and tune out videos, TV, and other people">🎓 learn my voice</button>
          <button id="camera-btn" type="button" title="Let her see you — one small frame every 2 seconds to her face sense; nothing is stored; off at every boot">📷 camera</button>
          <button id="face-enroll-btn" type="button" title="Teach her your face — one frame becomes a vector she compares against; no image is kept" style="display:none">👤 that's me</button>
          <button id="attach-btn" type="button" title="Attach a text/markdown/json file">+ attach</button>
          <button id="browser-btn" type="button" title="Open shared browser she can see/touch">⊕ browser</button>
          <button id="editor-btn" type="button" title="Open the Editor Studio (My Workspace)">⊞ editor</button>
          <button id="canvas-btn" type="button" title="Open Zoe's Canvas — deliverables &amp; visual aids">◫ canvas</button>
          <span id="browser-status" class="browser-status disconnected">offline</span>
          <span id="echo-status" class="browser-status disconnected" title="Echo suit — open the Echo app to connect">echo: offline</span>
          <span id="code-status" class="browser-status disconnected" title="Zoe is running code / analysis">idle</span>
          <span id="swarm-status" class="browser-status disconnected" title="Background research swarm in flight">swarm: off</span>
        </div>
        <input type="file" id="attach-input" accept=".txt,.md,.markdown,.json,.csv,.log,text/*" multiple style="display:none">
      </div>
    </div>
    <div id="sheep-pane">
      <div id="sheep-header">
        <span class="sheep-header-text">electric sheep</span>
        <button id="dashboard-toggle" type="button" title="Show depth dashboard">depth</button>
      </div>
      <div id="sheep-stream" aria-live="off"></div>
    </div>
  </div>

  <div id="dashboard-overlay" class="hidden" role="dialog" aria-modal="true">
    <div id="dashboard-panel">
      <div id="dashboard-header">
        <span>depth dashboard</span>
        <button id="dashboard-close" type="button">×</button>
      </div>
      <div id="dashboard-body"></div>
    </div>
  </div>

  <script src="chat.js"></script>
</body>
</html>
