<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Work Board</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #17171c; color: #e8e8ee; font: 14px/1.5 "Segoe UI", system-ui, sans-serif; }
  header { padding: 10px 14px; border-bottom: 1px solid #2c2c34; display: flex; justify-content: space-between; align-items: baseline; }
  header h1 { font-size: 14px; margin: 0; font-weight: 600; }
  #hint { font-size: 12px; color: #9a9aa6; }
  #board { padding: 10px 14px 20px; }
  #board svg { max-width: 100%; height: auto; }
</style>
</head>
<body>
<header><h1>Work Board <span style="color:#9a9aa6;font-weight:400">— live</span></h1><span id="hint">refreshes while work runs</span></header>
<div id="board"></div>
<script>
  const board = document.getElementById('board');
  // the SVG is authored by lib/work_board.js in the main process — deterministic layout with
  // every data-borne text node escaped there; this page only mounts it
  function mount(p) { if (p && p.svg) board.innerHTML = p.svg; }
  (async () => { try { mount(await window.sq.workBoardSnapshot()); } catch {} })();
  if (window.sq && window.sq.onWorkBoardTick) window.sq.onWorkBoardTick(mount);
</script>
</body>
</html>
