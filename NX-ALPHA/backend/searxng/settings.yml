use_default_settings: true

server:
  secret_key: "aura-local-dev-secret"
  bind_address: "0.0.0.0"
  port: 8080

search:
  safe_search: 0
  default_lang: "en"
  formats:
    - html
    - json          # REQUIRED — enables ?format=json API responses

engines:
  - name: google
    engine: google
    shortcut: g
    disabled: false

  - name: bing
    engine: bing
    shortcut: b
    disabled: false

  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg
    disabled: false

  - name: brave
    engine: brave
    shortcut: br
    disabled: false
