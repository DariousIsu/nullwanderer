<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Content Security Policy.
      - 'unsafe-inline' on style-src: required for GSAP and CSS-in-JS.
      - connect-src: allows SSE and WebSocket to localhost (dev) and the
        AURA backend. Tighten in production once backend URL is finalized.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src  'self' 'unsafe-inline';
        style-src   'self' 'unsafe-inline' https://fonts.googleapis.com;
        img-src     'self' data: blob: https:;
        media-src   'self' blob:;
        font-src    'self' data: https://fonts.gstatic.com;
        connect-src 'self' http://localhost:* ws://localhost:* http://127.0.0.1:* https://tile.openstreetmap.org https://*.openstreetmap.org https://gibs.earthdata.nasa.gov https://fonts.googleapis.com https://fonts.gstatic.com;
        worker-src  'self' blob:;
        child-src   'self' blob:;
        frame-src   'self' blob: https://www.youtube.com https://youtube.com https://www.youtube-nocookie.com https://player.vimeo.com https://*.google.com https://*.openstreetmap.org;
      "
    />

    <title>AURA NX-α</title>
    <link rel="icon" type="image/svg+xml" href="/aura-icon.svg" />

    <!--
      Base font pre-connect hints.
      If fonts are served locally (offline-first Electron), remove these.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Space+Grotesk:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
